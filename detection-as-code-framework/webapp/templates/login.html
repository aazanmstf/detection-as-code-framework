{% extends "base.html" %}
{% block title %}Log in - Detection as Code{% endblock %}
{% block auth_content %}
<section class="panel auth-panel reveal-up">
  <h2>Analyst Log In</h2>
  <p class="panel-note">Sign in to validate Sigma rules and access your detection history.</p>
  <form method="post" action="{{ url_for('auth.login') }}" class="stack-form">
    {{ csrf_field() }}
    <label for="username">Username or email</label>
    <input type="text" id="username" name="username" value="{{ username }}" autocomplete="username" required autofocus />

    <label for="password">Password</label>
    <input type="password" id="password" name="password" autocomplete="current-password" required />

    <button type="submit" class="btn btn-block">Log in</button>
  </form>
  <p class="auth-switch">No account yet? <a href="{{ url_for('auth.register') }}">Register</a></p>
</section>
{% endblock %}
